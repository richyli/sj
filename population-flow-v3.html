<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣人口流動 — 出生地 × 居住地</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf9f7;--surface:#fff;--border:#e5e2dc;--text:#1a1916;--muted:#888078;
  --accent:#c0392b;--blue:#2471a3;--blue-light:#e8f1f8;
  --mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
  --h1:#fde8e6;--h2:#f9b8b2;--h3:#f08070;--h4:#d95035;--h5:#9b1a0f;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}

header{background:var(--text);color:#fff;padding:.85rem 1.4rem}
.header-title{font-size:.95rem;font-weight:700}
.header-sub{font-family:var(--mono);font-size:.58rem;color:rgba(255,255,255,.4);margin-top:.1rem}

#loading{text-align:center;padding:4rem;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #d0ccc4;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:.5rem;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none}

/* APP SHELL */
.app-shell{display:flex}
.app-content{flex:1;min-width:0}
.view-panel{display:none;padding:1rem 1.2rem}
.view-panel.active{display:block}

/* VERTICAL NAV */
.v-nav{
  width:64px;flex-shrink:0;
  background:var(--text);
  display:flex;flex-direction:column;
  padding:.4rem 0;gap:1px;
  position:sticky;top:0;align-self:flex-start;
  min-height:calc(100vh - 44px);
}
.v-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.2rem;padding:.75rem .2rem;
  background:transparent;border:none;
  color:rgba(255,255,255,.45);cursor:pointer;
  transition:all .15s;font-family:var(--mono);
  font-size:.56rem;letter-spacing:.04em;text-align:center;
}
.v-icon{font-size:1rem;line-height:1}
.v-btn.active{background:var(--accent);color:#fff}
.v-btn:hover:not(.active){background:rgba(255,255,255,.1);color:#fff}

/* PANEL TOOLBAR */
.panel-toolbar{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar-title{font-weight:700;font-size:.88rem;flex-shrink:0}
.toolbar-hint{font-family:var(--mono);font-size:.59rem;color:var(--muted);margin-left:auto}
.ctl-group{display:flex;border:1px solid var(--border);overflow:hidden;border-radius:3px}
.ctl-btn{font-family:var(--mono);font-size:.63rem;padding:.3rem .75rem;background:var(--surface);border:none;border-right:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.ctl-btn:last-child{border-right:none}
.ctl-btn.active{background:var(--text);color:#fff}
.ctl-btn:hover:not(.active){background:var(--border);color:var(--text)}

/* SANKEY */
#sankey-wrap{background:var(--surface);border:1px solid var(--border);padding:.9rem}
#sankey-svg{width:100%;display:block}

/* MATRIX */
.matrix-layout{display:grid;grid-template-columns:1fr 560px;gap:1rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border)}
.panel-header{padding:.75rem 1.1rem .65rem;border-bottom:1px solid var(--border);display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.panel-title{font-weight:700;font-size:.85rem}
.panel-meta{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
.matrix-wrap{padding:.8rem 1rem;overflow-x:auto}
.matrix-note{font-family:var(--mono);font-size:.59rem;color:var(--muted);margin-bottom:.65rem;line-height:1.5}
.matrix-grid{display:grid;gap:1px}
.matrix-corner{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 4px 3px 0}
.axis-arrow{font-family:var(--mono);font-size:.5rem;color:#bbb;text-align:right;line-height:1.3}
.col-header{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-family:var(--mono);font-size:.58rem;color:var(--muted);padding:4px 2px;cursor:pointer;transition:color .15s}
.col-header:hover,.col-header.active{color:var(--accent);font-weight:500}
.row-header{font-family:var(--mono);font-size:.58rem;color:var(--muted);padding:2px 6px 2px 0;white-space:nowrap;display:flex;align-items:center;cursor:pointer;transition:color .15s}
.row-header:hover,.row-header.active{color:var(--accent);font-weight:500}
.cell{width:22px;height:22px;cursor:pointer;transition:transform .1s,box-shadow .1s;position:relative}
.cell:hover{transform:scale(2);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cell.diagonal{outline:1.5px solid rgba(0,0,0,.15);outline-offset:-1.5px}
.cell.selected{outline:2px solid var(--blue);outline-offset:-2px;z-index:20}
.legend{display:flex;align-items:center;gap:.45rem;margin-top:.6rem;font-family:var(--mono);font-size:.56rem;color:var(--muted)}
.legend-bar{display:flex;height:7px;flex:1;max-width:120px}
.legend-seg{flex:1}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:.5rem;padding:.8rem 1rem}
.stat-box{text-align:center}
.stat-num{font-family:var(--mono);font-size:1.25rem;font-weight:500;line-height:1}
.stat-label{font-size:.6rem;color:var(--muted);margin-top:.2rem}
.bars-wrap{padding:.4rem 1.1rem .9rem}
/* bar-row redefined in dual-bars section */
.bar-label{font-family:var(--mono);font-size:.58rem;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:var(--border);height:12px;overflow:hidden}
.bar-fill{height:100%;transition:width .4s ease}
.bar-val{font-family:var(--mono);font-size:.56rem;color:var(--muted);text-align:right}
.no-selection{text-align:center;padding:1.8rem 1.2rem;color:var(--muted);font-size:.73rem;font-style:italic;border-top:1px solid var(--border)}
.dual-bars{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
.dual-col{padding:.5rem .7rem .8rem}
.dual-col-title{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem}
.bar-row{display:grid;grid-template-columns:1fr 36px;align-items:center;gap:.3rem;margin-bottom:.4rem}
.bar-label{font-family:var(--mono);font-size:.57rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track-wrap{display:flex;flex-direction:column;gap:1px}
.bar-track{background:var(--border);height:10px;overflow:hidden}
.bar-fill{height:100%;transition:width .35s ease}
.bar-val{font-family:var(--mono);font-size:.55rem;color:var(--muted);text-align:right}

/* MAP */
.map-layout{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.map-panel{background:var(--surface);border:1px solid var(--border)}
.map-panel-header{padding:.65rem 1rem .55rem;border-bottom:1px solid var(--border);display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.map-panel-title{font-weight:700;font-size:.8rem}
.map-panel-sub{font-family:var(--mono);font-size:.56rem;color:var(--muted)}
.map-svg-wrap{padding:.4rem}
.map-svg-wrap svg{width:100%;display:block}
.county-path{stroke:#fff;stroke-width:.5;cursor:pointer;transition:opacity .12s}
.county-path:hover{opacity:.72;stroke-width:1.5;stroke:#333}
.county-path.selected{stroke:#1a1916;stroke-width:2;opacity:1}
.map-legend{display:flex;align-items:center;gap:.4rem;padding:.15rem .8rem .5rem;font-family:var(--mono);font-size:.55rem;color:var(--muted)}
.map-legend-bar{display:flex;height:6px;flex:1;max-width:100px}
.map-legend-seg{flex:1}

#tooltip{position:fixed;background:var(--text);color:#fff;padding:.45rem .7rem;font-family:var(--mono);font-size:.63rem;pointer-events:none;z-index:1000;display:none;max-width:220px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="header-title">台灣人口流動分析</div>
  <div class="header-sub">出生地 × 現居縣市 · 縣市層級 · 2025 年資料</div>
</header>

<div id="loading"><span class="spinner"></span>載入 od_county.csv 中…</div>

<div id="app">
  <div class="app-shell">

    <!-- ── VERTICAL NAV ── -->
    <nav class="v-nav">
      <button class="v-btn active" id="vbtn-sankey" onclick="switchTab('sankey',this)">
        <span class="v-icon">⟋</span>Sankey
      </button>
      <button class="v-btn" id="vbtn-matrix" onclick="switchTab('matrix',this)">
        <span class="v-icon">⊞</span>矩陣
      </button>
      <button class="v-btn" id="vbtn-map" onclick="switchTab('map',this)">
        <span class="v-icon">◎</span>地圖
      </button>
    </nav>

    <!-- ── CONTENT ── -->
    <div class="app-content">

      <!-- SANKEY -->
      <div class="view-panel active" id="panel-sankey">
        <div class="panel-toolbar">
          <div class="toolbar-title" id="sankeyTitle">人口流動 Sankey</div>
          <div class="toolbar-controls">
            <div class="ctl-group">
              <button class="ctl-btn active" id="scopeAll" onclick="setScope('all')">含同縣市</button>
              <button class="ctl-btn" id="scopeCross" onclick="setScope('cross')">跨縣市</button>
            </div>
          </div>
          <div class="toolbar-hint" id="sankeyHint">右側依現居地遷入量排序 · 點擊節點篩選</div>
        </div>
        <div id="sankey-wrap"><svg id="sankey-svg"></svg></div>
      </div>

      <!-- MATRIX -->
      <div class="view-panel" id="panel-matrix">
        <div class="panel-toolbar">
          <div class="toolbar-title">OD 矩陣熱圖</div>
          <div class="toolbar-controls">
            <div class="ctl-group">
              <button class="ctl-btn active" id="modeFrom" onclick="setMode('from')">出生地視角</button>
              <button class="ctl-btn" id="modeTo" onclick="setMode('to')">居住地視角</button>
            </div>
          </div>
          <div class="toolbar-hint" id="matrixMeta"></div>
        </div>
        <div class="matrix-layout">
          <div class="panel">
            <div class="matrix-wrap">
              <div class="matrix-note" id="matrixNote"></div>
              <div id="matrixGrid" class="matrix-grid"></div>
              <div class="legend">
                <span style="color:var(--blue)">▪ 留鄉</span>
                <div class="legend-bar">
                  <div class="legend-seg" style="background:#e8f1f8"></div>
                  <div class="legend-seg" style="background:#b3d0e8"></div>
                  <div class="legend-seg" style="background:#6ea8cf"></div>
                  <div class="legend-seg" style="background:#2e7db8"></div>
                  <div class="legend-seg" style="background:#1a4d7a"></div>
                </div>
                <span style="color:var(--accent)">▪ 跨縣市</span>
                <div class="legend-bar">
                  <div class="legend-seg" style="background:var(--h1)"></div>
                  <div class="legend-seg" style="background:var(--h2)"></div>
                  <div class="legend-seg" style="background:var(--h3)"></div>
                  <div class="legend-seg" style="background:var(--h4)"></div>
                  <div class="legend-seg" style="background:var(--h5)"></div>
                </div>
                <span>多（對數尺度）</span>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title" id="sideTitle">請選擇縣市</div>
            </div>
            <div id="sideContent"><div class="no-selection">點擊縣市名稱或格子<br>查看詳細流向</div></div>
          </div>
        </div>
      </div>

      <!-- MAP -->
      <div class="view-panel" id="panel-map">
        <div class="panel-toolbar">
          <div class="toolbar-title">雙地圖流向</div>
          <div class="toolbar-hint">點擊左圖（出生地）或右圖（現居地）縣市查看雙向流動</div>
        </div>
        <div class="map-layout">
          <div class="map-panel">
            <div class="map-panel-header">
              <div class="map-panel-title">出生地</div>
              <div class="map-panel-sub" id="mapLeftSub">點擊縣市查看流向</div>
            </div>
            <div class="map-svg-wrap">
              <svg id="map-left-svg" viewBox="0 0 380 380"></svg>
            </div>
            <div class="map-legend">
              <span>少</span>
              <div class="map-legend-bar">
                <div class="map-legend-seg" style="background:#e8f5e9"></div>
                <div class="map-legend-seg" style="background:#a5d6a7"></div>
                <div class="map-legend-seg" style="background:#66bb6a"></div>
                <div class="map-legend-seg" style="background:#388e3c"></div>
                <div class="map-legend-seg" style="background:#1b5e20"></div>
              </div>
              <span>多（√ 根號壓縮）</span>
            </div>
          </div>
          <div class="map-panel">
            <div class="map-panel-header">
              <div class="map-panel-title">現居地</div>
              <div class="map-panel-sub" id="mapRightSub">請先選擇出生地或現居地</div>
            </div>
            <div class="map-svg-wrap">
              <svg id="map-right-svg" viewBox="0 0 380 380">
                <text x="190" y="190" text-anchor="middle" font-family="var(--sans)" font-size="13" fill="#bbb">← 點擊左側縣市</text>
              </svg>
            </div>
            <div class="map-legend">
              <span>少</span>
              <div class="map-legend-bar">
                <div class="map-legend-seg" style="background:#e3eef7"></div>
                <div class="map-legend-seg" style="background:#9ecae1"></div>
                <div class="map-legend-seg" style="background:#4292c6"></div>
                <div class="map-legend-seg" style="background:#2171b5"></div>
                <div class="map-legend-seg" style="background:#08306b"></div>
              </div>
              <span>多（√ 根號壓縮）</span>
            </div>
          </div>
        </div>
      </div>

    </div><!-- app-content -->
  </div><!-- app-shell -->

<div id="tooltip"></div>

<script>
// ── STATE ──
let allData={}, years=[], counties=[], currentYear=null, currentMode='from', selectedCounty=null, sankeyFiltered=null, showSelf=true;

const COLORS_RED=['#f7f7f7','#fde8e6','#f9b8b2','#f08070','#d95035','#9b1a0f'];
const PALETTE=['#e07b54','#5b9bd5','#6abf8a','#f0c050','#9b71c4','#e06080','#50b0c0','#c08050','#70a060','#8090c0','#d0705a','#5080a0','#80b870','#c09030','#7060b0','#c05070','#409090','#b07040','#609050','#7080b0','#a06050','#4070a0'];

// ── FETCH ──
async function init() {
  try {
    const res = await fetch('od_county.csv');
    if (!res.ok) throw new Error();
    const text = await res.text();
    processData(Papa.parse(text,{header:true,skipEmptyLines:true}).data);
  } catch(e) {
    document.getElementById('loading').innerHTML='⚠️ 找不到 od_county.csv，請將檔案放在同一目錄。';
  }
}

function processData(rows) {
  const tmp={}, cset=new Set();
  rows.forEach(r=>{
    const yr=(r['year']||'').trim(), frm=(r['from']||'').trim(), to=(r['to']||'').trim(), pop=parseInt(r['pop']||0,10);
    if(yr!=='2025'||!frm||!to||isNaN(pop)) return;
    if(!tmp['2025']) tmp['2025']={};
    if(!tmp['2025'][frm]) tmp['2025'][frm]={};
    tmp['2025'][frm][to]=(tmp['2025'][frm][to]||0)+pop;
    cset.add(frm); cset.add(to);
  });
  allData=tmp; currentYear='2025'; counties=[...cset].sort();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  renderSankey(); renderMatrix();
}

// ── TABS ──
function switchTab(name,btn) {
  document.querySelectorAll('.v-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='sankey') renderSankey();
  if(name==='matrix') renderMatrix();
  if(name==='map') renderMapTab();
}

// Island counties — rendered as inset boxes bottom-left of each map
const ISLANDS = new Set(['澎湖縣','金門縣','連江縣']);
const ISLAND_CFG = {
  '連江縣': {bx:8,  by:10,  label:'連江'},
  '金門縣': {bx:8,  by:72,  label:'金門'},
  '澎湖縣': {bx:8,  by:134, label:'澎湖'},
};

// ── MAP STATE ──
let mapLeftSel  = null;  // county clicked on left  (出生地)
let mapRightSel = null;  // county clicked on right (現居地)

function normName(s){ return (s||'').trim().replace(/台/g,'臺'); }
function featureCounty(f){ return f.properties.COUNTYNAME || ''; }

function renderMapTab() { drawBothMaps(); }

function drawBothMaps() {
  const yr = allData['2025']||{};

  // LEFT: default=born totals; rightSel=birth origins of rightSel residents
  let leftVal;
  if(mapRightSel) {
    const dest=counties.find(c=>normName(c)===normName(mapRightSel))||mapRightSel;
    const lk={};
    counties.forEach(c=>{ lk[normName(c)]=(yr[c]||{})[dest]||0; });
    leftVal = cn => lk[normName(cn)]||0;
  } else {
    const bt={};
    counties.forEach(c=>{ bt[normName(c)]=Object.values(yr[c]||{}).reduce((a,b)=>a+b,0); });
    leftVal = cn => bt[normName(cn)]||0;
  }

  // RIGHT: leftSel=outflow from leftSel; rightSel=inflow origins to rightSel; else null
  let rightVal = null;
  if(mapLeftSel) {
    const fromKey=counties.find(c=>normName(c)===normName(mapLeftSel))||mapLeftSel;
    const fd=yr[fromKey]||{};
    const lk={};
    Object.entries(fd).forEach(([to,v])=>{ lk[normName(to)]=v; });
    rightVal = cn => lk[normName(cn)]||0;
  } else if(mapRightSel) {
    const dest=counties.find(c=>normName(c)===normName(mapRightSel))||mapRightSel;
    const lk={};
    counties.forEach(c=>{ lk[normName(c)]=(yr[c]||{})[dest]||0; });
    rightVal = cn => lk[normName(cn)]||0;
  }

  // Header labels
  if(mapLeftSel && !mapRightSel) {
    document.getElementById('mapLeftSub').textContent='已選：'+mapLeftSel;
    const fromKey=counties.find(c=>normName(c)===normName(mapLeftSel))||mapLeftSel;
    const tot=Object.values(yr[fromKey]||{}).reduce((a,b)=>a+b,0);
    document.getElementById('mapRightSub').textContent=`出生於 ${mapLeftSel}：${fmt(tot)} 人`;
  } else if(mapRightSel && !mapLeftSel) {
    document.getElementById('mapLeftSub').textContent=`出生地（現居 ${mapRightSel} 者）`;
    const dest=counties.find(c=>normName(c)===normName(mapRightSel))||mapRightSel;
    const tot=counties.reduce((s,c)=>s+((yr[c]||{})[dest]||0),0);
    document.getElementById('mapRightSub').textContent='已選：'+mapRightSel+`（共 ${fmt(tot)} 人）`;
  } else {
    document.getElementById('mapLeftSub').textContent='點擊縣市查看流向';
    document.getElementById('mapRightSub').textContent='請先選擇出生地或現居地';
  }

  // grayOthers: on clicked map, non-selected counties → gray; on other map → colored by data
  const grayLeft  = !!(mapLeftSel  && !mapRightSel);
  const grayRight = !!(mapRightSel && !mapLeftSel);
  drawMap('map-left-svg',  'left',  leftVal,  mapLeftSel,  grayLeft);
  drawMap('map-right-svg', 'right', rightVal, mapRightSel, grayRight);
}

function drawMap(svgId, side, valueOf, thisSel, grayOthers) {
  const W=380, H=380, PAD_LEFT=52;
  const svg = d3.select('#'+svgId).attr('viewBox',`0 0 ${W} ${H}`);
  svg.selectAll('*').remove();

  if(!valueOf) {
    svg.append('text').attr('x',W/2).attr('y',H/2)
      .attr('text-anchor','middle').attr('font-family','var(--sans)')
      .attr('font-size',13).attr('fill','#bbb')
      .text(side==='right'?'← 點擊左圖出生地 或 右圖現居地':'↓ 點擊縣市');
    return;
  }

  const mainF   = TW_GEO.features.filter(f=>!ISLANDS.has(featureCounty(f)));
  const islandF = TW_GEO.features.filter(f=> ISLANDS.has(featureCounty(f)));
  const proj    = d3.geoMercator().fitExtent([[PAD_LEFT+4,8],[W-4,H-8]],{type:'FeatureCollection',features:mainF});
  const pathFn  = d3.geoPath().projection(proj);

  // Sqrt colour scale
  const allVals = TW_GEO.features.map(f=>valueOf(featureCounty(f))).filter(v=>v>0);
  const sqrtMax = allVals.length ? Math.sqrt(Math.max(...allVals)) : 1;
  const interp  = side==='left' ? d3.interpolateGreens : d3.interpolateBlues;
  const dataColFn = v => v ? interp(Math.sqrt(v)/sqrtMax*0.88+0.06) : '#e4e4e4';

  const yr = allData['2025']||{};

  // Fill logic: if grayOthers=true, non-selected counties → uniform gray
  const fillFn = (cn) => {
    if(grayOthers && thisSel && normName(cn)!==normName(thisSel)) return '#d8d8d8';
    return dataColFn(valueOf(cn));
  };

  svg.selectAll('.county-path')
    .data(mainF).join('path')
    .attr('class', d=>'county-path'+(normName(featureCounty(d))===normName(thisSel||'')?' selected':''))
    .attr('d', pathFn)
    .attr('fill', d=>fillFn(featureCounty(d)))
    .attr('stroke','#fff').attr('stroke-width',.6)
    .style('cursor','pointer')
    .on('mouseenter',(ev,d)=>{ mapTip(ev, featureCounty(d), side, valueOf, yr); })
    .on('mousemove',moveTip).on('mouseleave',hideTip)
    .on('click',(ev,d)=>{ handleMapClick(side, featureCounty(d)); });

  mainF.forEach(f=>{
    const c=pathFn.centroid(f); if(isNaN(c[0])||isNaN(c[1])) return;
    svg.append('text').attr('x',c[0]).attr('y',c[1]+1)
      .attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-family','var(--sans)').attr('font-size',9)
      .attr('fill','#1a1916').attr('pointer-events','none')
      .text(featureCounty(f).replace(/[縣市]/,''));
  });

  islandF.forEach(f=>{
    const cn=featureCounty(f), cfg=ISLAND_CFG[cn]; if(!cfg) return;
    const BW=44, BH=54;
    const ip=d3.geoMercator().fitExtent([[cfg.bx+2,cfg.by+2],[cfg.bx+BW-2,cfg.by+BH-10]],f);
    const ipath=d3.geoPath().projection(ip);
    const isSel=normName(cn)===normName(thisSel||'');

    const ig=svg.append('g').style('cursor','pointer')
      .on('mouseenter',ev=>{ mapTip(ev,cn,side,valueOf,yr); })
      .on('mousemove',moveTip).on('mouseleave',hideTip)
      .on('click',()=>{ handleMapClick(side, cn); });

    ig.append('rect').attr('x',cfg.bx).attr('y',cfg.by)
      .attr('width',BW).attr('height',BH)
      .attr('fill','#f0f0f0').attr('stroke','#ccc').attr('stroke-width',.5).attr('rx',3);
    ig.append('path').attr('d',ipath(f))
      .attr('fill',fillFn(cn))
      .attr('stroke',isSel?'#1a1916':'#fff').attr('stroke-width',isSel?2:.6);
    ig.append('text').attr('x',cfg.bx+BW/2).attr('y',cfg.by+BH-2)
      .attr('text-anchor','middle')
      .attr('font-family','var(--sans)').attr('font-size',9).attr('fill','#555')
      .text(cfg.label);
  });
}

function handleMapClick(side, cn) {
  if(side==='left') {
    mapLeftSel  = (mapLeftSel && normName(mapLeftSel)===normName(cn)) ? null : cn;
    mapRightSel = null;
  } else {
    mapRightSel = (mapRightSel && normName(mapRightSel)===normName(cn)) ? null : cn;
    mapLeftSel  = null;
  }
  drawBothMaps();
}

function mapTip(ev, cn, side, valueOf, yr) {
  const v = valueOf(cn);
  if(side==='left') {
    if(mapRightSel) {
      const dest=counties.find(c=>normName(c)===normName(mapRightSel))||mapRightSel;
      const tot=counties.reduce((s,c)=>s+((yr[c]||{})[dest]||0),0)||1;
      showTip(ev,`出生地：<strong>${cn}</strong><br>現居 ${mapRightSel}：${fmt(v)} 人（${(v/tot*100).toFixed(1)}%）`);
    } else {
      showTip(ev,`<strong>${cn}</strong><br>出生人口：${fmt(v)} 人`);
    }
  } else {
    if(!valueOf||!v){ showTip(ev,`<strong>${cn}</strong><br>點擊選取現居地`); return; }
    if(mapLeftSel) {
      const fromKey=counties.find(c=>normName(c)===normName(mapLeftSel))||mapLeftSel;
      const tot=Object.values(yr[fromKey]||{}).reduce((a,b)=>a+b,0)||1;
      showTip(ev,`出生地：<strong>${mapLeftSel}</strong><br>現居地：<strong>${cn}</strong><br>${fmt(v)} 人（${(v/tot*100).toFixed(1)}%）`);
    } else if(mapRightSel) {
      const dest=counties.find(c=>normName(c)===normName(mapRightSel))||mapRightSel;
      const tot=counties.reduce((s,c)=>s+((yr[c]||{})[dest]||0),0)||1;
      showTip(ev,`現居地：<strong>${cn}</strong><br>出生於此現居 ${mapRightSel}：${fmt(v)} 人（${(v/tot*100).toFixed(1)}%）`);
    } else {
      showTip(ev,`<strong>${cn}</strong><br>點擊選取現居地`);
    }
  }
}


function buildYearTabs() {
  document.getElementById('yearTabs').innerHTML=years.map(y=>
    `<button class="year-tab${y===currentYear?' active':''}" onclick="setYear('${y}')">${y}</button>`
  ).join('');
}

function setYear(y) {
  currentYear=y; sankeyFiltered=null;
  document.querySelectorAll('.year-tab').forEach(b=>b.classList.toggle('active',b.textContent===y));
  renderSankey(); renderMatrix();
  if(selectedCounty) renderSide(selectedCounty);
}

function setMode(m) {
  currentMode=m;
  document.getElementById('modeFrom').classList.toggle('active',m==='from');
  document.getElementById('modeTo').classList.toggle('active',m==='to');
  renderMatrix();
  if(selectedCounty) renderSide(selectedCounty);
}

function setScope(s) {
  showSelf = (s==='all');
  document.getElementById('scopeAll').classList.toggle('active', showSelf);
  document.getElementById('scopeCross').classList.toggle('active', !showSelf);
  renderSankey();
}

// ════════════════════════════════════════════
// SANKEY
// ════════════════════════════════════════════
function renderSankey() {
  const yr=allData[currentYear]||{};
  const colorMap={};
  counties.forEach((c,i)=>{ colorMap[c]=PALETTE[i%PALETTE.length]; });

  let flows=[];
  counties.forEach(frm=>counties.forEach(to=>{
    if(frm===to && !showSelf) return;
    const v=(yr[frm]?.[to])||0;
    if(v>0) flows.push({from:frm,to,self:frm===to,value:v});
  }));
  if(sankeyFiltered) flows=flows.filter(f=>f.from===sankeyFiltered||f.to===sankeyFiltered);

  const inflowTot={}, outflowTot={};
  flows.forEach(f=>{
    inflowTot[f.to]=(inflowTot[f.to]||0)+f.value;
    outflowTot[f.from]=(outflowTot[f.from]||0)+f.value;
  });

  const topOrder=[...new Set(flows.map(f=>f.from))].sort((a,b)=>(outflowTot[b]||0)-(outflowTot[a]||0));
  const botOrder=[...new Set(flows.map(f=>f.to))].sort((a,b)=>(inflowTot[b]||0)-(inflowTot[a]||0));

  const wrap=document.getElementById('sankey-wrap');
  // Fixed width = wrap width, no horizontal scroll
  const W=wrap.clientWidth-18;
  const GAP=4, NODE_H=20, LABEL_H=32, BAND_H=160;
  const ISLANDS_SET=new Set(['連江縣','金門縣','澎湖縣']);

  // Node widths: mainland = sqrt-proportional, islands always visible minimum
  function computeWidths(order, totalFn) {
    if(!order.length) return [];
    const tots=order.map(c=>totalFn(c)||0);
    const sqrts=tots.map(t=>Math.sqrt(t));
    const sqrtSum=sqrts.reduce((a,b)=>a+b,0)||1;
    const available=W - GAP*(order.length-1);
    // mainland min=16, island min=24 (always legible)
    return sqrts.map((s,i)=>Math.max(ISLANDS_SET.has(order[i])?24:14, (s/sqrtSum)*available));
  }

  const tSizes=computeWidths(topOrder,c=>outflowTot[c]);
  const bSizes=computeWidths(botOrder,c=>inflowTot[c]);

  function xPos(sizes){ const pos=[]; let x=0; sizes.forEach(s=>{pos.push(x);x+=s+GAP;}); return pos; }
  const tX=xPos(tSizes), bX=xPos(bSizes);
  const tMap={}, bMap={};
  topOrder.forEach((c,i)=>{ tMap[c]={x:tX[i],w:tSizes[i]}; });
  botOrder.forEach((c,i)=>{ bMap[c]={x:bX[i],w:bSizes[i]}; });

  const topY=LABEL_H, nodeY=topY, ribbonY=topY+NODE_H, botNodeY=ribbonY+BAND_H;
  const H=botNodeY+NODE_H+LABEL_H+4;

  const svg=d3.select('#sankey-svg')
    .attr('width',W).attr('height',H)
    .attr('viewBox',`0 0 ${W} ${H}`)
    .style('max-width','100%').style('overflow','visible');
  svg.selectAll('*').remove();

  // helper: desaturate a hex colour
  function desaturate(hex) {
    const c=d3.color(hex); if(!c) return '#ccc';
    const hsl=d3.hsl(c); hsl.s*=0.15; hsl.l=0.82;
    return hsl.formatHex();
  }

  const tFill={}, bFill={};
  topOrder.forEach(c=>{ tFill[c]=0; });
  botOrder.forEach(c=>{ bFill[c]=0; });

  const sorted=[...flows].sort((a,b)=>{
    const d=topOrder.indexOf(a.from)-topOrder.indexOf(b.from);
    return d||botOrder.indexOf(a.to)-botOrder.indexOf(b.to);
  });

  // Ribbons
  const rG=svg.append('g');
  sorted.forEach(flow=>{
    const tn=tMap[flow.from], bn=bMap[flow.to]; if(!tn||!bn) return;
    const tW=(flow.value/(outflowTot[flow.from]||1))*tn.w;
    const bW=(flow.value/(inflowTot[flow.to]||1))*bn.w;
    const x0=tn.x+tFill[flow.from], x1=bn.x+bFill[flow.to];
    tFill[flow.from]+=tW; bFill[flow.to]+=bW;
    const y0=ribbonY, y1=botNodeY, cy=(y0+y1)/2;
    const path=`M${x0},${y0} C${x0},${cy} ${x1},${cy} ${x1},${y1} L${x1+bW},${y1} C${x1+bW},${cy} ${x0+tW},${cy} ${x0+tW},${y0} Z`;

    // Desaturate if filtered and this flow is not from/to the filtered county
    const dim = sankeyFiltered && flow.from!==sankeyFiltered && flow.to!==sankeyFiltered;
    const baseColor = flow.self?'#aaa':colorMap[flow.from];
    const fillColor = dim ? desaturate(baseColor) : baseColor;
    const baseOp = flow.self?.22:.30;

    const fromPct=((flow.value/(outflowTot[flow.from]||1))*100).toFixed(1);
    const toPct=((flow.value/(inflowTot[flow.to]||1))*100).toFixed(1);
    const tipHtml=flow.self
      ?`<strong>${flow.from}</strong><br>留在出生縣市<br>${fmt(flow.value)} 人 (${fromPct}%)`
      :`出生地：<strong>${flow.from}</strong><br>現居地：<strong>${flow.to}</strong><br>${fmt(flow.value)} 人<br>佔出生地 ${fromPct}%・佔現居地 ${toPct}%`;

    rG.append('path').attr('d',path)
      .attr('fill',fillColor).attr('opacity',dim?0.18:baseOp)
      .attr('stroke',fillColor).attr('stroke-width',.3)
      .style('cursor','pointer')
      .on('mouseenter',function(ev){ d3.select(this).attr('opacity',dim?0.28:0.65); showTip(ev,tipHtml); })
      .on('mousemove',moveTip)
      .on('mouseleave',function(){ d3.select(this).attr('opacity',dim?0.18:baseOp); hideTip(); });
  });

  // Top nodes (出生地)
  topOrder.forEach(c=>{
    const n=tMap[c];
    const isActive = !sankeyFiltered || sankeyFiltered===c;
    const nodeColor = isActive ? colorMap[c] : desaturate(colorMap[c]);
    const g=svg.append('g').style('cursor','pointer')
      .on('click',()=>{ sankeyFiltered=sankeyFiltered===c?null:c; renderSankey(); });
    g.append('rect').attr('x',n.x).attr('y',nodeY).attr('width',n.w).attr('height',NODE_H)
      .attr('fill',nodeColor).attr('opacity',isActive?1:0.4).attr('rx',2);
    if(n.w>18){
      g.append('text').attr('x',n.x+n.w/2).attr('y',nodeY-4)
        .attr('text-anchor','middle').attr('font-family','var(--sans)').attr('font-size',10)
        .attr('fill',isActive?(sankeyFiltered===c?'var(--accent)':'var(--text)'):'#aaa')
        .text(c.replace(/[縣市]/,''));
    }
  });

  // Bottom nodes (現居地)
  botOrder.forEach(c=>{
    const n=bMap[c];
    const isActive = !sankeyFiltered || sankeyFiltered===c;
    const nodeColor = isActive ? colorMap[c] : desaturate(colorMap[c]);
    const g=svg.append('g').style('cursor','pointer')
      .on('click',()=>{ sankeyFiltered=sankeyFiltered===c?null:c; renderSankey(); });
    g.append('rect').attr('x',n.x).attr('y',botNodeY).attr('width',n.w).attr('height',NODE_H)
      .attr('fill',nodeColor).attr('opacity',isActive?1:0.4).attr('rx',2);
    if(n.w>18){
      g.append('text').attr('x',n.x+n.w/2).attr('y',botNodeY+NODE_H+13)
        .attr('text-anchor','middle').attr('font-family','var(--sans)').attr('font-size',10)
        .attr('fill',isActive?(sankeyFiltered===c?'var(--accent)':'var(--text)'):'#aaa')
        .text(c.replace(/[縣市]/,''));
    }
  });

  // Axis labels
  svg.append('text').attr('x',0).attr('y',nodeY-18)
    .attr('font-family','var(--mono)').attr('font-size',10).attr('fill','var(--muted)').text('出生地 ↓');
  svg.append('text').attr('x',0).attr('y',botNodeY+NODE_H+28)
    .attr('font-family','var(--mono)').attr('font-size',10).attr('fill','var(--muted)').text('現居地 ↑');

  if(sankeyFiltered){
    svg.append('text').attr('x',W/2).attr('y',ribbonY+BAND_H/2)
      .attr('text-anchor','middle').attr('font-family','var(--mono)').attr('font-size',10).attr('fill','var(--accent)')
      .text(`篩選：${sankeyFiltered}　（再次點擊取消）`);
  }

  document.getElementById('sankeyTitle').textContent=`${currentYear} 年 ${showSelf?'全部（含留鄉）':'跨縣市'}人口流動`;
  document.getElementById('sankeyHint').textContent=showSelf?'灰色帶=留鄉 · 點擊縣市篩選':'跨縣市流動 · 點擊縣市篩選';
}


// ════════════════════════════════════════════
// MATRIX
// ════════════════════════════════════════════
function getCellValue(rowC,colC) {
  const yr=allData[currentYear]||{};
  return currentMode==='from'?(yr[rowC]?.[colC]||0):(yr[colC]?.[rowC]||0);
}

function renderMatrix() {
  const n=counties.length, grid=document.getElementById('matrixGrid');
  const yr=allData[currentYear]||{};

  // Row totals for % calculation
  const rowTotals={};
  counties.forEach(r=>{
    rowTotals[r]=counties.reduce((s,c)=>s+getCellValue(r,c),0)||1;
  });

  // colour by % of row total (each cell = share of that county's total)
  const BLUES=['#f0f5fb','#c6dcf0','#7eb5d9','#2e7db8','#0d4a7a'];
  function cs(v, isDiag, rowC) {
    if(!v) return '#f5f5f5';
    const pct=v/rowTotals[rowC];  // 0–1
    // use sqrt for gentler steps
    const t=Math.sqrt(pct);
    if(isDiag) {
      const idx=Math.min(Math.floor(t*BLUES.length), BLUES.length-1);
      return BLUES[idx];
    }
    return COLORS_RED[Math.min(Math.floor(t*COLORS_RED.length), COLORS_RED.length-1)];
  }

  grid.style.cssText=`display:grid;grid-template-columns:62px repeat(${n},22px);grid-template-rows:62px repeat(${n},22px);gap:1px;`;
  let html=`<div class="matrix-corner"><div class="axis-arrow">${currentMode==='from'?'出生地↓':'居住地↓'}<br>${currentMode==='from'?'→居住地':'→出生地'}</div></div>`;
  counties.forEach(c=>{html+=`<div class="col-header${selectedCounty===c?' active':''}" onclick="selectCounty('${c}')" title="${c}">${c}</div>`;});
  counties.forEach(r=>{
    html+=`<div class="row-header${selectedCounty===r?' active':''}" onclick="selectCounty('${r}')">${r}</div>`;
    counties.forEach(c=>{
      const isDiag=r===c, v=getCellValue(r,c);
      const frm=currentMode==='from'?r:c, to=currentMode==='from'?c:r;
      const sel=(selectedCounty===r||selectedCounty===c)?' selected':'';
      html+=`<div class="cell${isDiag?' diagonal':''}${sel}" style="background:${cs(v,isDiag,r)}" data-from="${frm}" data-to="${to}" data-val="${v}" onmouseenter="showTip(event,this)" onmouseleave="hideTip()" onclick="cellClick('${r}','${c}')"></div>`;
    });
  });
  grid.innerHTML=html;
  document.getElementById('matrixMeta').textContent=`${currentYear} 年・${counties.length} 縣市`;
  document.getElementById('matrixNote').textContent=currentMode==='from'
    ?'縱軸（列）= 出生地，橫軸（欄）= 現居縣市。對角線 = 留在出生縣市。'
    :'縱軸（列）= 現居縣市，橫軸（欄）= 出生地。對角線 = 留在出生縣市。';
}

function cellClick(r,c){selectCounty(r===c?r:(currentMode==='from'?r:c));}
function selectCounty(name){selectedCounty=name;renderMatrix();renderSide(name);}

function renderSide(name) {
  document.getElementById('sideTitle').textContent=name;
  const yr=allData[currentYear]||{}, outData=yr[name]||{};
  const stayVal=outData[name]||0;
  const totalOut=Object.values(outData).reduce((s,v)=>s+v,0);
  const movedOut=totalOut-stayVal;
  const movedIn=counties.reduce((s,c)=>s+(yr[c]?.[name]||0),0)-stayVal;
  const outFlows=counties.filter(c=>c!==name).map(c=>({county:c,val:outData[c]||0})).sort((a,b)=>b.val-a.val).slice(0,10);
  const inFlows=counties.filter(c=>c!==name).map(c=>({county:c,val:yr[c]?.[name]||0})).sort((a,b)=>b.val-a.val).slice(0,10);
  const outMax=outFlows[0]?.val||1, inMax=inFlows[0]?.val||1;
  document.getElementById('sideContent').innerHTML=`
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num" style="color:var(--accent)">${fmt(movedOut)}</div><div class="stat-label">離開出生地</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--blue)">${fmt(movedIn)}</div><div class="stat-label">外縣市遷入</div></div>
      <div class="stat-box"><div class="stat-num">${fmt(stayVal)}</div><div class="stat-label">留在出生縣市</div></div>
      <div class="stat-box"><div class="stat-num">${pct(stayVal,totalOut)}</div><div class="stat-label">留鄉率</div></div>
    </div>
    <div class="dual-bars">
      <div class="dual-col">
        <div class="dual-col-title" style="color:var(--accent)">移居至…</div>
        ${outFlows.map(f=>barRow(f.county,f.val,outMax,'var(--accent)')).join('')}
      </div>
      <div class="dual-col">
        <div class="dual-col-title" style="color:var(--blue)">出生於…</div>
        ${inFlows.map(f=>barRow(f.county,f.val,inMax,'var(--blue)')).join('')}
      </div>
    </div>`;
}

function barRow(label,val,max,color){
  const w=max>0?(val/max*100).toFixed(1):0;
  return `<div class="bar-row"><div class="bar-label">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div><div class="bar-val">${fmt(val)}</div></div>`;
}

// ── TOOLTIP ──
const tip=document.getElementById('tooltip');
function showTip(event,htmlOrEl){
  if(typeof htmlOrEl==='string'){tip.innerHTML=htmlOrEl;}
  else{
    const el=htmlOrEl,from=el.dataset.from,to=el.dataset.to,v=parseInt(el.dataset.val);
    const el2=htmlOrEl,from2=el2.dataset.from,to2=el2.dataset.to,v2=parseInt(el2.dataset.val);
    const rowKey2=currentMode==='from'?from2:to2;
    const rowTot2=counties.reduce((s,c)=>s+getCellValue(rowKey2,c),0)||1;
    const p2=(v2/rowTot2*100).toFixed(1);
    tip.innerHTML=from2===to2
      ?`<strong>${from2}</strong><br>留鄉：${fmt(v2)} 人（${p2}%）`
      :`出生地：<strong>${from2}</strong><br>現居地：<strong>${to2}</strong><br>${fmt(v2)} 人（${p2}%）`;
  }
  tip.style.display='block'; moveTip(event);
}
document.addEventListener('mousemove',moveTip);
function moveTip(e){if(tip.style.display==='none') return;tip.style.left=Math.min(e.clientX+14,window.innerWidth-230)+'px';tip.style.top=(e.clientY-10)+'px';}
function hideTip(){tip.style.display='none';}

function fmt(n){return n>=10000?(n/10000).toFixed(1)+'萬':n.toLocaleString();}
function pct(a,b){return b?(a/b*100).toFixed(1)+'%':'—';}

init();
</script>
